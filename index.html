<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17231f"><title>成败有时，不可丧志｜训练日志</title>
<style>
:root{--bg:#f3f5f0;--paper:#fff;--ink:#18251f;--muted:#78827b;--line:#e2e8e1;--green:#47775c;--green-light:#e9f1ea;--red:#b95649;--shadow:0 12px 32px #17231f0c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}aside{background:#17231f;color:#f3f5f0;padding:22px 15px;display:flex;flex-direction:column;gap:18px}.brand{font-size:19px;font-weight:800;padding:5px 10px;line-height:1.25}.brand span{display:block;color:#aab7ad;font-size:12px;font-weight:500;margin-top:5px}.cap{font-size:11px;color:#aab7ad;letter-spacing:.12em;padding:0 10px}.projects{display:grid;gap:5px}.project{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:transparent;color:#dce5de;text-align:left;border-radius:10px;padding:10px}.project.active,.project:hover{background:#2a3931;color:#fff}.project-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project-count{font-size:12px;color:#b8c8ba}.side-buttons{display:grid;gap:8px}.side-buttons button{background:transparent;border:1px solid #48564d;color:#eaf0eb;border-radius:10px;padding:9px}.side-bottom{margin-top:auto;color:#9ca99f;font-size:12px;padding:0 10px}main{width:100%;max-width:1160px;margin:auto;padding:34px clamp(16px,4vw,54px) 70px}.header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}.eyebrow{font-size:11px;color:var(--green);font-weight:800;letter-spacing:.14em}.header h1{margin:5px 0 2px;font-size:clamp(27px,4vw,38px);line-height:1.2}.date{font-size:14px;color:var(--muted)}.header-actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:#fff;font-weight:700}.btn:hover{filter:brightness(.96)}.btn.light{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.red{background:#fff0ec;color:var(--red)}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.8fr);gap:18px;align-items:start}.stack{display:grid;gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow)}.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.card h2{font-size:17px;margin:0}.badge{background:var(--green-light);color:var(--green);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:750}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.field{display:grid;gap:6px;min-width:0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:#fbfcfa;color:var(--ink);padding:10px 11px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#78a186;box-shadow:0 0 0 3px #47775c16}.field textarea{min-height:115px;resize:vertical}.field input:disabled,.field select:disabled,.quantity-control button:disabled{opacity:.48;cursor:not-allowed}.quantity-control{display:grid;grid-template-columns:minmax(0,1fr)}.unit-row{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:7px}.unit-row.unit-only{grid-template-columns:1fr}.unit-row.unit-only .quantity-control{display:none}.full{grid-column:1/-1}.plan-slot:empty,.project-slot:empty{display:none}.mode-hint{grid-column:1/-1;padding:12px 14px;border:1px solid #c9dfcf;border-left:4px solid var(--green);border-radius:11px;background:#f0f7f1;color:#315a40}.mode-hint strong{display:block;font-size:13px;margin-bottom:3px}.mode-hint span{display:block;font-size:12px;line-height:1.65}.timer-box{background:#f3f6f2;border-radius:15px;text-align:center;padding:18px;margin-top:18px}.timer-label{font-size:13px;color:var(--muted)}.timer{font-size:43px;line-height:1.2;font-weight:850;font-variant-numeric:tabular-nums;margin:5px}.progress{height:8px;border-radius:20px;background:#e1e7e1;overflow:hidden;margin:15px 4px 8px}.progress i{display:block;height:100%;background:var(--green);border-radius:20px;transition:width .25s}.next-set{font-size:13px;color:var(--muted)}.set-area{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:16px 0}.subtle{font-size:12px;color:var(--muted)}.set-number{font-size:27px;font-weight:850}.rest-buttons{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.rest-buttons .btn{padding:9px 11px}.rest-buttons button:disabled{opacity:.48;cursor:not-allowed}.primary-wide{width:100%;font-size:16px;padding:13px}.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.today-list,.history-list,.log-list{display:grid;gap:9px}.today-row,.plan-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.today-row:last-child,.plan-row:last-child{border-bottom:0}.today-row strong,.plan-row strong{display:block}.today-row small,.plan-row small{color:var(--muted);font-size:12px}.entry{padding:0 0 11px;border-bottom:1px solid var(--line)}.entry:last-child{border:0;padding:0}.entry h3{font-size:14px;margin:0 0 4px}.entry p{font-size:13px;color:#4f5b53;margin:4px 0}.empty{color:var(--muted);font-size:13px;padding:5px 0}.history-day{border:1px solid var(--line);border-radius:11px;padding:11px}.history-day summary{font-weight:700;cursor:pointer}.history-day p{font-size:13px;color:#505c54;margin:7px 0 0}.pill{font-size:12px;color:var(--green);background:var(--green-light);border-radius:99px;padding:4px 9px}.modal{border:0;border-radius:17px;padding:22px;width:min(500px,calc(100% - 28px));box-shadow:0 20px 70px #0003}.modal::backdrop{background:#10171375}.modal h2{margin:0 0 15px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#17231f;color:white;padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.hidden{display:none!important}@media(max-width:800px){.app{display:block}aside{position:sticky;top:0;z-index:3;padding:11px 12px;gap:9px}.brand{font-size:16px;padding:0 4px}.brand span{display:inline;margin-left:6px}.cap,.side-bottom{display:none}.projects{display:flex;overflow:auto;gap:5px}.project{white-space:nowrap;padding:8px 10px;font-size:13px}.side-buttons{display:flex}.side-buttons button{padding:7px 10px;font-size:12px}main{padding:22px 13px 50px}.layout{grid-template-columns:1fr}.card{padding:16px}.header{margin-bottom:15px}.header-actions .btn{font-size:12px;padding:8px 10px}}@media(max-width:700px){#planSection{display:none}.header{display:block}.mobile-plan-slot{display:none}#mobileProjectsSlot{margin-top:10px}#mobileProjectsSlot .projects{display:flex;flex-wrap:wrap;overflow:visible;gap:6px}#mobileProjectsSlot .project{background:#fff;border:1px solid var(--line);color:var(--ink);padding:6px 10px;font-size:12px}#mobileProjectsSlot .project.active{background:var(--green);color:#fff}#mobileProjectsSlot .project.active .project-count{color:#eaf3ec}.fields{grid-template-columns:1fr}.full{grid-column:auto}.unit-row{grid-template-columns:minmax(0,1fr) 110px}.set-area{align-items:stretch;flex-direction:column}.rest-buttons{justify-content:flex-start}main{padding:20px 12px 42px}.card{padding:15px}}@media(max-width:420px){.fields{grid-template-columns:1fr}.full{grid-column:auto}.header{display:block}.header-actions{margin-top:10px}.unit-row{grid-template-columns:minmax(0,1fr) 105px}.rest-buttons .btn{padding:8px 9px;font-size:12px}}
</style><style>#editProject{display:none!important}</style></head>
<body><div class="app"><aside><div class="brand">成败有时，不可丧志<span>训练日志</span></div><div><div class="cap">训练项目</div><div id="desktopProjectsSlot" class="project-slot"><nav id="projects" class="projects"></nav></div></div><div class="side-buttons"><button id="addProject">＋ 新建项目</button></div><div class="side-bottom">训练项目与每日记录</div></aside>
<main><header class="header"><div><div class="eyebrow">TRAINING JOURNAL</div><h1 id="title">今日训练</h1><div class="date" id="date"></div><div id="mobileProjectsSlot" class="project-slot"></div></div></header>
<div class="layout"><div class="stack"><section class="card"><div class="card-head"><h2>当前训练</h2><span id="modeBadge" class="badge">固定组</span></div><div class="fields"><div class="field"><label for="name">项目名称</label><input id="name" type="text"></div><div class="field"><label for="mode">组数计算方式</label><select id="mode"><option value="fixed">固定组</option><option value="ascending">递增组</option><option value="descending">递减组</option><option value="pyramid">金字塔组</option></select></div><div class="field"><label for="sets">目标组数</label><input id="sets" type="number" min="1" max="100"></div><div class="field"><label id="baseLabel" for="base">每组次数 / 时长</label><div class="unit-row"><div class="quantity-control"><input id="base" type="number" min="1" step="1"></div><select id="quantityUnit"><option value="次">次数</option><option value="秒">秒</option><option value="分钟">分钟</option><option value="小时">小时</option></select></div></div><div class="field"><label for="rest">组间休息时间</label><div class="unit-row"><input id="rest" type="number" min="0" step="1"><select id="restUnit"><option value="秒">秒</option><option value="分钟">分钟</option></select></div></div><div class="field"><label id="startLabel" for="start">递增/递减起始值</label><input id="start" type="number" min="1" step="1"></div><div class="field"><label id="stepLabel" for="step">每组变化幅度</label><input id="step" type="number" min="1" step="1"></div></div>
<div id="modeHint" class="mode-hint" aria-live="polite"></div><div class="timer-box"><div id="timerLabel" class="timer-label">准备开始</div><div id="timer" class="timer">00:00</div><div class="progress"><i id="bar" style="width:0%"></i></div><div id="nextSet" class="next-set"></div></div>
<div class="set-area"><div><div class="subtle">完成组数</div><div class="set-number"><span id="done">0</span><span class="subtle"> / </span><span id="total">0</span><span class="subtle"> 组</span></div></div><div class="rest-buttons"><button class="btn light" id="restMinus1">休息 −1s</button><button class="btn light" id="restPlus1">休息 +1s</button><button class="btn light" id="restMinus15">休息 −15s</button><button class="btn light" id="restPlus15">休息 +15s</button></div></div>
<button class="btn primary-wide" id="complete">完成一组 · 开始休息</button><div class="action-row"><button class="btn light" id="undo">撤销一组</button><button class="btn light" id="reset">重置今日进度</button><button class="btn light" id="skip">跳过休息</button></div></section>
<section class="card"><h2>训练历史</h2><div id="history" class="history-list" style="margin-top:12px"></div></section></div>
<div class="stack"><section class="card"><div class="card-head"><h2>今日训练日志</h2><span id="logDate" class="pill"></span></div><div id="logEntries" class="log-list" style="margin-top:14px"></div><div class="field" style="margin-top:16px"><label for="summary">每日小结</label><textarea id="summary" placeholder="记录今天的状态、完成情况或训练感受"></textarea></div><div class="action-row"><button class="btn light" id="export">导出日志</button></div></section><section id="planSection" class="card"><h2>训练计划</h2><div id="plan" style="margin-top:10px"></div></section><section class="card"><h2>数据备份</h2><div class="action-row"><button class="btn light" id="backup">导出备份</button><label class="btn light" for="restore">导入备份</label><input id="restore" class="hidden" type="file" accept="application/json"></div></section></div></div></main></div>
<dialog id="projectDialog" class="modal"><form id="projectForm"><h2 id="dialogTitle">新建项目</h2><div class="fields"><div class="field full"><label for="dName">项目名称</label><input id="dName" required></div><div class="field"><label for="dSets">目标组数</label><input id="dSets" type="number" min="1" max="100" value="3"></div><div class="field"><label for="dBase">每组次数 / 时长</label><div class="unit-row"><input id="dBase" type="number" min="1" value="5"><select id="dUnit"><option value="次">次数</option><option value="秒">秒</option><option value="分钟">分钟</option><option value="小时">小时</option></select></div></div><div class="field"><label for="dRest">组间休息</label><div class="unit-row"><input id="dRest" type="number" min="0" value="60"><select id="dRestUnit"><option value="秒">秒</option><option value="分钟">分钟</option></select></div></div><div class="field"><label for="dMode">组数计算方式</label><select id="dMode"><option value="fixed">固定组</option><option value="ascending">递增组</option><option value="descending">递减组</option><option value="pyramid">金字塔组</option></select></div><div class="field"><label for="dStart">递增/递减起始数量</label><input id="dStart" type="number" min="1" value="5"></div><div class="field"><label for="dStep">每组变化幅度</label><input id="dStep" type="number" min="1" value="1"></div></div><div class="modal-actions"><button class="btn light" id="cancelDialog" type="button">取消</button><button class="btn" type="submit">保存项目</button></div></form></dialog><div id="toast" class="toast"></div>
<script>
(()=>{
const KEY='chengbai-training-v3',OLD='chengbai-training-v1',$=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('sv-SE'),unitFactor=u=>({秒:1,分钟:60,小时:3600,次:1}[u]||1),uid=()=>Math.random().toString(36).slice(2,10),clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function migrate(){try{const old=JSON.parse(localStorage.getItem(OLD));if(!old)return null;const projects=(old.projects||[]).map(p=>{const m=String(p.reps||'5 次').match(/^\s*(\d+(?:\.\d+)?)(.*)$/);const u=p.unit||({'次':'次','秒':'秒','分钟':'分钟','小时':'小时'}[(m?.[2]||'').trim()]||'次');return{id:p.id||uid(),name:p.name||'训练项目',sets:+p.sets||10,base:m?+m[1]:5,unit:u,mode:['fixed','ascending','descending','pyramid'].includes(p.mode)?p.mode:'fixed',start:+(p.startValue||p.pyramidStart)||(m?+m[1]:5),step:+p.stepValue||1,restSec:+p.rest||60,restUnit:p.restUnit||'秒'}});return{projects,activeId:old.activeId||projects[0]?.id,days:old.days||{},timerEnd:0}}catch{return null}}
function initial(){try{return JSON.parse(localStorage.getItem(KEY))||migrate()||{projects:[{id:uid(),name:'俯卧撑',sets:10,base:5,unit:'次',mode:'fixed',start:5,step:1,restSec:60,restUnit:'秒'}],activeId:null,days:{},timerEnd:0}}catch{return{projects:[{id:uid(),name:'俯卧撑',sets:10,base:5,unit:'次',mode:'fixed',start:5,step:1,restSec:60,restUnit:'秒'}],activeId:null,days:{},timerEnd:0}}}
let data=initial();if(!data.projects?.length)data.projects=[{id:uid(),name:'俯卧撑',sets:10,base:5,unit:'次',mode:'fixed',start:5,step:1,restSec:60,restUnit:'秒'}];if(!data.activeId||!data.projects.some(p=>p.id===data.activeId))data.activeId=data.projects[0].id;if(!data.days)data.days={};
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function day(){if(!data.days[today()])data.days[today()]={entries:[],summary:''};return data.days[today()]}function active(){return data.projects.find(p=>p.id===data.activeId)}function entryFor(p){return day().entries.find(e=>e.projectId===p.id)}
function placeProjectNav(){const nav=$('projects'),slot=matchMedia('(max-width: 700px)').matches?$('mobileProjectsSlot'):$('desktopProjectsSlot');if(nav.parentElement!==slot)slot.appendChild(nav)}window.addEventListener('resize',placeProjectNav);
function distribution(p){const n=clamp(+p.sets||1,1,100),start=Math.max(1,+p.start||+p.base||1),step=Math.max(1,+p.step||1);return Array.from({length:n},(_,i)=>{let v;if(p.mode==='ascending')v=start+i*step;else if(p.mode==='descending')v=Math.max(1,start-i*step);else if(p.mode==='pyramid'){const half=Math.ceil(n/2),level=i<half?i:n-1-i;v=start+Math.max(0,level)*step}else v=+p.base||1;return Number.isInteger(v)?v:Number(v.toFixed(2))})}
function ensureEntry(p){let e=entryFor(p);if(!e){e={projectId:p.id,name:p.name,completed:0,total:p.sets,base:p.base,start:p.start,step:p.step,unit:p.unit,mode:p.mode,restSec:p.restSec,restUnit:p.restUnit,setRecords:[],startedAt:null};day().entries.push(e)}syncEntry(p,e);return e}function syncEntry(p,e){e.name=p.name;e.total=+p.sets||1;e.base=+p.base||1;e.start=+p.start||+p.base||1;e.step=+p.step||1;e.unit=p.unit;e.mode=p.mode;e.restSec=+p.restSec||0;e.restUnit=p.restUnit||'秒';if(!Array.isArray(e.setRecords))e.setRecords=[];save()}
function notify(s){const el=$('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1700)}function formatClock(sec){sec=Math.max(0,Math.ceil(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}function qty(v,u){const n=Number(v),val=Number.isFinite(n)?(Number.isInteger(n)?n:Number(n.toFixed(2))):0;return `${val} ${u||''}`.trim()}
function render(){const p=active();$('date').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('logDate').textContent=new Date().toLocaleDateString('zh-CN');$('projects').innerHTML=data.projects.map(x=>{const e=entryFor(x);return `<button class="project ${x.id===data.activeId?'active':''}" data-project="${x.id}"><span class="project-name">${esc(x.name)}</span><span class="project-count">${e?.completed||0}/${x.sets}</span></button>`}).join('');document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{data.activeId=b.dataset.project;save();render()});if(p){const e=entryFor(p);if(e)syncEntry(p,e);$('title').textContent=p.name;$('name').value=p.name;$('mode').value=p.mode;$('sets').value=p.sets;$('base').value=p.base;$('quantityUnit').value=p.unit;const isFixed=p.mode==='fixed';$('base').closest('.unit-row').classList.toggle('unit-only',!isFixed);$('base').disabled=!isFixed;$('baseLabel').textContent=isFixed?'每组次数 / 时长':'递增 / 递减单位（次数或时长）';$('start').disabled=isFixed;$('step').disabled=isFixed;$('startLabel').textContent=isFixed?'递增/递减起始值（当前模式停用）':'递增/递减起始值';$('stepLabel').textContent=isFixed?'每组变化幅度（当前模式停用）':'每组增加 / 减少幅度';$('rest').value=p.restUnit==='分钟'?p.restSec/60:p.restSec;$('restUnit').value=p.restUnit;$('start').value=p.start;$('step').value=p.step;$('modeBadge').textContent=({fixed:'固定组',ascending:'递增组',descending:'递减组',pyramid:'金字塔组'})[p.mode]||'固定组';const values=distribution(p),modeText=({fixed:'固定组：每组都按“每组次数 / 时长”执行。',ascending:'递增组：从 '+qty(p.start,p.unit)+' 开始，每组增加 '+qty(p.step,p.unit)+'。',descending:'递减组：从 '+qty(p.start,p.unit)+' 开始，每组减少 '+qty(p.step,p.unit)+'，最低为 1。',pyramid:'金字塔组：从 '+qty(p.start,p.unit)+' 逐组递增到峰值，再对称递减。'})[p.mode];$('modeHint').innerHTML='<strong>'+(({fixed:'固定组 · 每组目标相同',ascending:'递增组 · 逐组增加',descending:'递减组 · 逐组减少',pyramid:'金字塔组 · 先升后降'})[p.mode]||'固定组')+'</strong><span>'+modeText+'</span><span>'+values.length+' 组安排：'+values.map(v=>qty(v,p.unit)).join(' → ')+'</span>';const done=e?.completed||0,total=+p.sets||1;$('done').textContent=done;$('total').textContent=total;$('bar').style.width=Math.min(100,done/total*100)+'%';$('nextSet').textContent=done>=total?`目标组数已完成 · 第 ${done+1} 组可继续记录`:`第 ${done+1} 组 · 目标 ${qty(distribution(p)[done]??p.base,p.unit)}`;$('complete').textContent=done>=total?'继续记录一组':'完成一组 · 开始休息';}else{$('title').textContent='今日训练'}
const remaining=data.timerEnd?Math.max(0,Math.ceil((data.timerEnd-Date.now())/1000)):0;if(remaining){$('timerLabel').textContent='休息倒计时';$('timer').textContent=formatClock(remaining)}else{$('timerLabel').textContent='准备开始';$('timer').textContent='00:00';if(data.timerEnd){data.timerEnd=0;save();notify('休息结束，开始下一组！')}}const resting=remaining>0;for(const id of ['restMinus1','restPlus1','restMinus15','restPlus15'])$(id).disabled=!resting;
const entries=day().entries;$('logEntries').innerHTML=entries.length?entries.map(e=>{const mode=({fixed:'固定组',ascending:'递增组',descending:'递减组',pyramid:'金字塔组'})[e.mode]||'固定组';const dist=distribution({...e,sets:e.total,base:e.base,start:e.start,step:e.step});return `<div class="entry"><h3>${esc(e.name)}　<span class="pill">${e.completed}/${e.total} 组</span></h3><p>训练内容：${e.completed?dist.slice(0,e.completed).map(v=>qty(v,e.unit)).join('、'):'尚未完成组'}${e.completed<e.total?`（目标 ${e.total} 组）`:''}</p><p>组间休息 ${qty(e.restUnit==='分钟'?e.restSec/60:e.restSec,e.restUnit)} · ${mode}</p>${e.setRecords?.length?`<p>${e.setRecords.map((r,i)=>`第${i+1}组 ${new Date(r.at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}`).join(' · ')}</p>`:''}</div>`}).join(''):'<div class="empty">完成训练组后自动生成日志。</div>';$('summary').value=day().summary||'';$('plan').innerHTML=data.projects.map(x=>`<div class="plan-row"><div><strong>${esc(x.name)}</strong><small>${x.sets} 组 · ${qty(x.base,x.unit)} · 休息 ${qty(x.restUnit==='分钟'?x.restSec/60:x.restSec,x.restUnit)}</small></div><button class="btn light" data-select="${x.id}">查看</button></div>`).join('');document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{data.activeId=b.dataset.select;save();render()});const keys=Object.keys(data.days).filter(k=>k<=today()).sort().reverse();$('history').innerHTML=keys.length?keys.map(k=>{const d=data.days[k];return `<details class="history-day"><summary>${new Date(k+'T12:00:00').toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'})} · ${d.entries?.length||0} 个项目</summary>${(d.entries||[]).map(e=>`<p><b>${esc(e.name)}</b>　${e.completed}/${e.total} 组 · ${qty(e.base,e.unit)}</p>`).join('')}${d.summary?`<p>小结：${esc(d.summary)}</p>`:''}</details>`}).join(''):'<div class="empty">训练记录会按日期整理在这里。</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateConfig(){const p=active();if(!p)return;p.name=$('name').value.trim()||'未命名项目';p.mode=$('mode').value;p.sets=clamp(Number($('sets').value)||1,1,100);p.base=Math.max(1,Number($('base').value)||1);p.unit=$('quantityUnit').value;p.restUnit=$('restUnit').value;p.restSec=Math.max(0,Number($('rest').value)||0)*unitFactor(p.restUnit);p.start=Math.max(1,Number($('start').value)||1);p.step=Math.max(1,Number($('step').value)||1);const e=entryFor(p);if(e)syncEntry(p,e);save();render()}
function recordSet(){const p=active();if(!p)return;const e=ensureEntry(p);const list=distribution(p),idx=e.completed;e.startedAt=e.startedAt||Date.now();e.completed++;e.setRecords.push({at:Date.now(),value:list[idx]??p.base});syncEntry(p,e);if(e.completed<+p.sets&&p.restSec>0)data.timerEnd=Date.now()+p.restSec*1000;else data.timerEnd=0;save();render();if(e.completed>=p.sets)notify('目标组数完成！')}
function adjustRest(delta){if(!data.timerEnd)return;data.timerEnd=Math.max(Date.now(),data.timerEnd+delta*1000);if(data.timerEnd<=Date.now()){data.timerEnd=0;notify('休息结束，开始下一组！')}save();render()}
function undo(){const p=active(),e=p&&entryFor(p);if(!e?.completed)return;data.timerEnd=0;e.completed--;e.setRecords.pop();syncEntry(p,e);save();render();notify('已撤销一组')}function resetToday(){const p=active(),e=p&&entryFor(p);if(!p)return;if(!e?.completed){notify('当前项目还没有训练进度');return}if(!confirm('清除“'+p.name+'”今天已完成的组数和日志？'))return;day().entries=day().entries.filter(x=>x.projectId!==p.id);data.timerEnd=0;save();render();notify('今日进度已重置')}function openDialog(p=null){$('dialogTitle').textContent=p?'编辑训练项目':'新建训练项目';$('dName').value=p?.name||'';$('dSets').value=p?.sets||3;$('dBase').value=p?.base||5;$('dUnit').value=p?.unit||'次';$('dRest').value=p?(p.restUnit==='分钟'?p.restSec/60:p.restSec):60;$('dRestUnit').value=p?.restUnit||'秒';$('dMode').value=p?.mode||'fixed';$('dStart').value=p?.start||p?.base||5;$('dStep').value=p?.step||1;$('projectDialog').dataset.edit=p?.id||'';$('projectDialog').showModal()}
function saveDialog(ev){ev.preventDefault();const id=$('projectDialog').dataset.edit;const p=id?data.projects.find(x=>x.id===id):{id:uid()};Object.assign(p,{name:$('dName').value.trim()||'未命名项目',sets:clamp(Number($('dSets').value)||1,1,100),base:Math.max(1,Number($('dBase').value)||1),unit:$('dUnit').value,restSec:Math.max(0,Number($('dRest').value)||0)*unitFactor($('dRestUnit').value),restUnit:$('dRestUnit').value,mode:$('dMode').value,start:Math.max(1,Number($('dStart').value)||1),step:Math.max(1,Number($('dStep').value)||1)});if(!id){data.projects.push(p);data.activeId=p.id}const e=entryFor(p);if(e)syncEntry(p,e);save();$('projectDialog').close();render()}
function download(name,text,type='text/plain;charset=utf-8'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportText(){let s=`成败有时，不可丧志\n${today()}\n\n训练内容\n`;for(const e of day().entries)s+=`${e.name}：完成 ${e.completed}/${e.total} 组，${qty(e.base,e.unit)}，组休 ${qty(e.restUnit==='分钟'?e.restSec/60:e.restSec,e.restUnit)}\n`;s+=`\n小结\n${day().summary||''}\n`;return s}
document.querySelectorAll('#name,#mode,#sets,#base,#quantityUnit,#rest,#start,#step').forEach(el=>el.addEventListener('change',updateConfig));$('restUnit').addEventListener('change',()=>{const p=active();if(!p)return;p.restUnit=$('restUnit').value;save();render()});$('complete').onclick=recordSet;$('undo').onclick=undo;$('reset').onclick=resetToday;$('skip').onclick=()=>{if(data.timerEnd){data.timerEnd=0;save();render();notify('已跳过休息')}};$('restMinus1').onclick=()=>adjustRest(-1);$('restPlus1').onclick=()=>adjustRest(1);$('restMinus15').onclick=()=>adjustRest(-15);$('restPlus15').onclick=()=>adjustRest(15);$('summary').addEventListener('input',e=>{day().summary=e.target.value;save()});$('addProject').onclick=()=>openDialog();$('projectForm').addEventListener('submit',saveDialog);$('cancelDialog').onclick=()=>$('projectDialog').close();$('export').onclick=()=>download(`训练日志-${today()}.txt`,exportText());$('backup').onclick=()=>download('成败有时-训练数据备份.json',JSON.stringify(data,null,2),'application/json');$('restore').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.projects)||!d.days)throw Error();if(confirm('导入备份会覆盖当前浏览器中的训练数据，是否继续？')){data=d;save();render();notify('导入成功')}}catch{alert('备份文件格式无效')}e.target.value=''};
function notify(s){const el=$('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1700)}
placeProjectNav();render();save();setInterval(()=>{if(data.timerEnd){if(data.timerEnd<=Date.now()){data.timerEnd=0;save();notify('休息结束，开始下一组！')}const sec=data.timerEnd?Math.max(0,Math.ceil((data.timerEnd-Date.now())/1000)):0;$('timerLabel').textContent=sec?'休息倒计时':'准备开始';$('timer').textContent=formatClock(sec);const resting=sec>0;for(const id of ['restMinus1','restPlus1','restMinus15','restPlus15'])$(id).disabled=!resting}},250);
})();
</script></body></html>
